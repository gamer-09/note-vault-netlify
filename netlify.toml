# Netlify deployment (replaces the former GitHub Pages workflow).
# Vite single-page app built into dist. base defaults to "/" (see vite.config.js).
[build]
  command = "npm ci && npm run build"
  publish = "dist"

# Vite 8 and the pinned toolchain need a modern Node; match the CI workflow.
[build.environment]
  NODE_VERSION = "24"

# Headers Netlify serves from its edge. The production CSP is an HTML meta policy,
# which browsers do not let express frame-ancestors, so framing is refused here
# instead; the no-referrer policy the build already declares is restated too.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
