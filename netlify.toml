# Netlify deployment (replaces the former GitHub Pages workflow).
# Vite single-page app built into dist. base defaults to "/" (see vite.config.js).
[build]
  command = "npm ci && npm run build"
  publish = "dist"

# Vite 8 and the pinned toolchain need a modern Node; match the CI workflow.
[build.environment]
  NODE_VERSION = "24"
